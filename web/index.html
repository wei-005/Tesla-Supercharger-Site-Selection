<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超充选址地图</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#0b1324; --glass:rgba(13,22,40,.82); --line:rgba(255,255,255,.10); --ink:#eef2f8; --muted:#9fb0c8;
  --metro:#8ab4f8; --corridor:#f6b26b; --core:#0b1020; --open:#7f8ea6; --pipe:#d3b06f;
  --halo:0 0 0 1px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 "Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;background:var(--bg)}
.leaflet-container{background:#0e1422;font:inherit}
.tint{filter:brightness(1.15) sepia(1) hue-rotate(185deg) saturate(3)}   /* CARTO dark grey -> navy */
.labels{filter:brightness(1.35) contrast(1.05);opacity:.9}
.panel{position:fixed;z-index:800;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.35)}

/* title */
#title{top:16px;left:16px;padding:14px 16px;max-width:420px}
#title h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.3px}
#title .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.kpis{display:flex;gap:18px;margin-top:10px}
.kpi b{display:block;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--muted)}

/* legend + toggles */
#legend{left:0;right:0;margin:0 auto;width:max-content;bottom:16px;padding:8px 14px;font-size:12.5px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 120px)}
#legend .row,#legend .keys{display:flex;align-items:center;gap:8px}
#legend .keys{gap:14px}
#legend .sep{width:1px;height:16px;background:var(--line)}
#legend label{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted)}
#legend input{accent-color:var(--metro);margin:0}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
#legend button{font:inherit;font-size:12px;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer}

/* drawer */
#toggle{top:16px;right:16px;padding:9px 14px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
#drawer{top:64px;right:16px;bottom:16px;width:340px;display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform .25s ease}
#drawer.open{transform:none}
.list{overflow:auto;padding:8px}
.card{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.card:hover{background:rgba(255,255,255,.05)}
.card.on{border-color:var(--metro);background:rgba(138,180,248,.08)}
.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;color:var(--core)}
.card h3{margin:0;font-size:14px;font-weight:700}
.card .en{color:var(--muted);font-size:12px}
.card .meta{font-size:12px;margin-top:3px;color:#c9d4e4}
#drawer .foot{padding:8px 14px 12px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}

/* site marker with callout label */
.site{position:relative;width:0;height:0;cursor:pointer}
.site .halo{position:absolute;left:-19px;top:-19px;width:38px;height:38px;border-radius:50%;opacity:.28;background:var(--c)}
.site .disc{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:50%;background:var(--c);
  border:2px solid rgba(255,255,255,.45);box-shadow:0 0 14px var(--c)}
.site .disc::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--core)}
.site svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.site .lab{position:absolute;white-space:nowrap;transform:translateY(-50%);
  text-shadow:0 0 3px #000,0 0 6px rgba(0,0,0,.9),0 1px 2px #000}
.site .lab.l{text-align:right;transform:translate(-100%,-50%)}
.site .lab.c{text-align:center;transform:translate(-50%,0)}
.lab .cn{font-size:19px;font-weight:700;letter-spacing:.5px;line-height:1.2}
.lab .cn i{font-style:normal;font-size:12px;font-weight:700;color:var(--core);background:var(--c);border-radius:9px;padding:0 6px;margin:0 6px;vertical-align:3px;text-shadow:none}
.lab .en{font-size:14px;line-height:1.25}
.lab .d{font-size:13px;line-height:1.3;color:#d6e0ee}
.site.sel .disc{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25),0 0 18px var(--c)}
body.compact .lab .d,body.compact .lab .en{display:none}
body.tiny .lab,body.tiny .site svg{display:none}
.disc .n{display:none}
body.tiny .disc::after{display:none}
body.tiny .disc .n{display:grid;place-items:center;width:100%;height:100%;font-size:12px;color:var(--core)}

/* popup */
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#121c31;color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.leaflet-popup-content{margin:12px 14px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.pop{font-size:12.5px;line-height:1.55;min-width:270px;max-width:330px}
.pop h4{margin:0;font-size:15px}
.pop .addr{color:var(--muted);margin:2px 0 8px}
.pop table{border-collapse:collapse;width:100%}
.pop td{padding:2px 0;vertical-align:top}
.pop td:first-child{color:var(--muted);width:92px;white-space:nowrap}
.pop details{margin-top:6px}
.pop summary{cursor:pointer;color:var(--muted)}
.pop p{margin:4px 0;color:#cfd8e6}
.pop .links{margin-top:8px;display:flex;gap:14px}
.pop a{color:var(--metro);text-decoration:none;font-weight:700}
.gm-style .gm-style-iw-c{background:#121c31!important;padding:0!important}
.gm-style .gm-style-iw-d{overflow:auto!important;padding:12px 14px!important;color:var(--ink)}
.gm-style .gm-style-iw-tc::after{background:#121c31!important}
.gm-style .gm-ui-hover-effect span{background-color:#9fb0c8!important}

.leaflet-control-attribution{background:rgba(11,19,36,.7)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:#b9c8de!important}
.leaflet-bar a{background:var(--glass);color:var(--ink);border-color:var(--line)}
.leaflet-bar a:hover{background:#1b2742}

@media (max-width:760px){
  #title{left:10px;right:10px;top:10px;max-width:none;padding:10px 12px}
  #title h1{font-size:16px}#title .sub{display:none}
  .kpis{gap:14px;margin-top:6px}.kpi b{font-size:15px}
  #toggle{top:auto;bottom:16px;right:10px;padding:9px 10px}
  #legend{left:10px;right:70px;margin:0;width:auto;max-width:none;bottom:16px;font-size:11.5px;padding:7px 10px;gap:8px 10px;justify-content:flex-start}
  #legend .keys,#legend .sep{display:none}
  #drawer{top:auto;left:10px;right:10px;bottom:62px;width:auto;height:55vh;transform:translateY(calc(100% + 80px))}
  .lab .cn{font-size:15px}.lab .en{font-size:12px}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="title" class="panel">
  <h1>2026 年特斯拉超充新建 10 站</h1>
  <div class="sub">H3 网格 + 选址-配置联合优化 · 点击站点查看配置与运营方式</div>
  <div class="kpis" id="kpis"></div>
</div>

<div id="legend" class="panel">
  <div class="keys">
    <div class="row"><span class="sw" style="background:var(--metro);box-shadow:0 0 8px var(--metro)"></span>都市圈站</div>
    <div class="row"><span class="sw" style="background:var(--corridor);box-shadow:0 0 8px var(--corridor)"></span>高速走廊站</div>
  </div><span class="sep"></span>
  <div class="row"><label><input type="checkbox" id="tOpen"><span class="sw" style="background:var(--open);width:8px;height:8px"></span>特斯拉已开通</label></div>
  <div class="row"><label><input type="checkbox" id="tPipe"><span class="sw" style="background:var(--pipe);width:8px;height:8px"></span>在建 / 许可 / 规划</label></div>
  <div class="row"><label><input type="checkbox" id="tRing">6 km 排除圈</label></div>
  <span class="sep"></span>
  <div class="row"><button id="gbtn" type="button"></button></div>
</div>

<button id="toggle" class="panel" type="button">站点列表</button>
<div id="drawer" class="panel">
  <div class="list" id="list"></div>
  <div class="foot">数据：supercharge.info、模型输出 final_10_sites.csv。经济指标为模型估算。</div>
</div>

<script src="basemap.js"></script>
<script src="sites.js"></script>
<script>
/* Google 底图（可选）：填入 Maps JavaScript API key，或用 index.html?gkey=YOUR_KEY 打开，
   或点左下按钮输入（只存本浏览器）。不填则使用 CARTO 深色底图，无需 key。 */
const GOOGLE_MAPS_API_KEY = "";

const S = window.SITES, T = window.TESLA;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const col = s => s.segment === "corridor" ? css("--corridor") : css("--metro");
const shortIC = s => s.replace(/（.*）/, "");
const hostName = s => s.host.replace(/\s*\(.*\)\s*$/, "");
const gUrl = s => `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`;
const svUrl = s => `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${s.lat},${s.lng}`;
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
const usd = w => "$" + (w / 100).toFixed(1) + "M";

/* ---------- panels ---------- */
const sum = f => S.reduce((a, s) => a + f(s), 0);
document.getElementById("kpis").innerHTML = [[S.length, "站点"], [sum(s => s.stalls), "V4 超充桩"], [sum(s => s.l2), "L2 慢充"], [usd(sum(s => s.npv)), "组合 NPV"]]
  .map(([v, l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("");
document.getElementById("list").innerHTML = S.map(s => `
  <div class="card" data-r="${s.rank}">
    <div class="num" style="background:${col(s)}">${s.rank}</div>
    <div><h3>${esc(s.city_cn)}</h3><div class="en">${esc(s.city_en)} · ${esc(hostName(s))}</div>
    <div class="meta">${s.stalls} 桩 V4${s.trailer ? `（${s.trailer} 拖挂）` : ""} · ${s.l2} L2 · ${esc(shortIC(s.interconnect))} · NPV ${usd(s.npv)}</div></div>
  </div>`).join("");
const drawer = document.getElementById("drawer"), tbtn = document.getElementById("toggle");
tbtn.onclick = () => { drawer.classList.toggle("open"); tbtn.textContent = drawer.classList.contains("open") ? "收起列表" : "站点列表"; };

function popupHtml(s) {
  const row = (k, v) => `<tr><td>${k}</td><td>${v}</td></tr>`;
  return `<div class="pop">
    <h4>#${s.rank} ${esc(s.city_cn)} · ${esc(hostName(s))}</h4>
    <div class="addr">${esc(s.address)}</div>
    <table>
      ${row("类型", s.segment === "corridor" ? "高速走廊站" : "都市圈站")}
      ${row("经纬度", `${s.lat.toFixed(6)}, ${s.lng.toFixed(6)}`)}
      ${row("超充（V4）", `${s.stalls} 桩${s.trailer ? `，含 ${s.trailer} 个拖挂直通位` : ""}`)}
      ${row("慢充（L2）", `${s.l2} 个`)}
      ${row("并网", `${esc(shortIC(s.interconnect))}，申请 ${s.request_kw.toLocaleString()} kW`)}
      ${row("储能", s.megapacks ? `${s.megapacks} 台 Megapack` : "无（基准电网情景）")}
      ${row("预计通电", `${s.months} 个月`)}
      ${row("营业", esc(s.hours))}
      ${row("首年电量", `${s.mwh.toLocaleString()} MWh（走廊 ${s.corridor_mwh.toLocaleString()}）`)}
      ${row("利用率", `${Math.round(s.util * 100)}%`)}
      ${row("CAPEX / NPV", `${usd(s.capex)} / ${usd(s.npv)}`)}
      ${row("竞品需求占比", `${Math.round(s.comp_share * 100)}%`)}
      ${row("距最近特斯拉站", `${s.d_tesla} km（含在建/规划）`)}
    </table>
    <details><summary>电网运行与定价</summary><p>${esc(s.grid)}</p><p>${esc(s.pricing)}</p></details>
    <details><summary>备选宿主</summary><p>${esc(s.alternate)}</p></details>
    <div class="links"><a href="${gUrl(s)}" target="_blank" rel="noopener">在 Google 地图打开</a><a href="${svUrl(s)}" target="_blank" rel="noopener">街景</a></div>
  </div>`;
}

/* marker + leader line + label, positioned around a zero-size anchor */
function siteHtml(s) {
  const left = s.dx < 0, mid = s.dx === 0, r = 15, len = Math.hypot(s.dx, s.dy) || 1;
  const x0 = s.dx / len * r, y0 = s.dy / len * r;
  const desc = `${s.stalls} 桩超充 · ${s.l2} 慢充${s.segment === "corridor" ? " · I-5 走廊" : ""}`;
  return `<div class="site" data-r="${s.rank}" style="--c:${col(s)}">
    <svg width="1" height="1"><line x1="${x0}" y1="${y0}" x2="${mid ? 0 : s.dx - (left ? -4 : 4)}" y2="${mid ? s.dy - 4 : s.dy}" stroke="rgba(255,255,255,.55)" stroke-width="1"/></svg>
    <div class="halo"></div><div class="disc"><b class="n">${s.rank}</b></div>
    <div class="lab ${left ? "l" : mid ? "c" : ""}" style="left:${s.dx}px;top:${s.dy}px">
      <div class="cn">${esc(s.city_cn)}<i>${s.rank}</i></div>
      <div class="en">${esc(s.city_en)}</div>
      <div class="d">${esc(desc)}</div>
    </div></div>`;
}
const narrow = () => window.innerWidth <= 760;
function zoomClass(z) { document.body.classList.toggle("compact", z < 3.75); document.body.classList.toggle("tiny", z < 3 || (narrow() && z < 6)); }

let engine;
function select(rank) {
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("on", +c.dataset.r === rank));
  document.querySelectorAll(".site").forEach(c => c.classList.toggle("sel", +c.dataset.r === rank));
}

/* ---------- Leaflet + CARTO dark ---------- */
function leafletEngine() {
  const map = L.map("map", {preferCanvas: true, zoomControl: false, zoomSnap: .25, zoomDelta: .5, worldCopyJump: true});
  L.control.zoom({position: "bottomright"}).addTo(map);
  if (window.BASEMAP) {                         // vector outlines under the tiles (visible offline / if tiles are blocked)
    map.createPane("vec").style.zIndex = 150;
    L.geoJSON(BASEMAP.countries, {pane: "vec", interactive: false, style: {fillColor: "#1d3346", fillOpacity: 1, color: "#3d5a73", weight: .8}}).addTo(map);
    L.geoJSON(BASEMAP.states, {pane: "vec", interactive: false, style: {fillColor: "#24304d", fillOpacity: 1, color: "#8ea3c2", opacity: .45, weight: 1, dashArray: "5 4"}}).addTo(map);
  }
  const carto = l => `https://{s}.basemaps.cartocdn.com/${l}/{z}/{x}/{y}{r}.png`;
  L.tileLayer(carto("dark_nolabels"), {subdomains: "abcd", maxZoom: 19, className: "tint",
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'}).addTo(map);
  L.tileLayer(carto("dark_only_labels"), {subdomains: "abcd", maxZoom: 19, className: "labels"}).addTo(map);
  const lay = {open: L.layerGroup(), pipe: L.layerGroup(), ring: L.layerGroup(), sites: L.layerGroup().addTo(map)};
  T.forEach(([la, ln, p, n]) => L.circleMarker([la, ln], {radius: 2.4, weight: 0, fillOpacity: .7, fillColor: p ? css("--pipe") : css("--open")})
    .bindTooltip(`特斯拉${p ? "在建/规划" : "已开通"}${n ? ` · ${n} 桩` : ""}`).addTo(p ? lay.pipe : lay.open));
  const markers = {};
  S.forEach(s => {
    markers[s.rank] = L.marker([s.lat, s.lng], {icon: L.divIcon({className: "", iconSize: [0, 0], html: siteHtml(s)}), zIndexOffset: 1000, riseOnHover: true})
      .bindPopup(popupHtml(s), {maxWidth: 350, offset: [0, -12], autoPanPaddingTopLeft: L.point(16, narrow() ? 120 : 175), autoPanPaddingBottomRight: L.point(16, 80)}).on("click", () => select(s.rank)).addTo(lay.sites);
    L.circle([s.lat, s.lng], {radius: 6000, color: col(s), weight: 1, dashArray: "4 4", fillOpacity: .08}).addTo(lay.ring);
  });
  const fit = () => map.fitBounds(L.latLngBounds(S.map(s => [s.lat, s.lng])), narrow() ? {paddingTopLeft: [24, 130], paddingBottomRight: [24, 70]} : {paddingTopLeft: [200, 150], paddingBottomRight: [200, 90]});
  fit(); map.on("zoomend", () => zoomClass(map.getZoom())); zoomClass(map.getZoom());
  return {
    name: "底图：CARTO 深色",
    toggle(k, on) { on ? lay[k].addTo(map) : map.removeLayer(lay[k]); },
    focus(s) { map.flyTo([s.lat, s.lng], 12, {duration: .9}); setTimeout(() => markers[s.rank].openPopup(), 950); }
  };
}

/* ---------- Google Maps (dark style, Chinese labels) ---------- */
const NIGHT = [
  {elementType: "geometry", stylers: [{color: "#1d2c4d"}]}, {elementType: "labels.text.fill", stylers: [{color: "#8ec3b9"}]},
  {elementType: "labels.text.stroke", stylers: [{color: "#1a3646"}]},
  {featureType: "administrative.country", elementType: "geometry.stroke", stylers: [{color: "#6b80a6"}]},
  {featureType: "administrative.province", elementType: "geometry.stroke", stylers: [{color: "#4b6878"}]},
  {featureType: "landscape.natural", elementType: "geometry", stylers: [{color: "#23395b"}]},
  {featureType: "poi", stylers: [{visibility: "off"}]},
  {featureType: "road", elementType: "geometry", stylers: [{color: "#304a7d"}]},
  {featureType: "road.highway", elementType: "geometry", stylers: [{color: "#2c6675"}]},
  {featureType: "road", elementType: "labels", stylers: [{visibility: "simplified"}]},
  {featureType: "transit", stylers: [{visibility: "off"}]},
  {featureType: "water", elementType: "geometry", stylers: [{color: "#0e1626"}]},
  {featureType: "water", elementType: "labels.text.fill", stylers: [{color: "#4e6d70"}]}];
function googleEngine() {
  const g = google.maps;
  const map = new g.Map(document.getElementById("map"), {center: {lat: 39, lng: -97}, zoom: 4, styles: NIGHT, backgroundColor: "#0e1626",
    disableDefaultUI: true, zoomControl: true, zoomControlOptions: {position: g.ControlPosition.RIGHT_BOTTOM}, gestureHandling: "greedy"});
  const info = new g.InfoWindow();
  class Site extends g.OverlayView {
    constructor(s) { super(); this.s = s; this.p = new g.LatLng(s.lat, s.lng); }
    onAdd() { const d = document.createElement("div"); d.style.position = "absolute"; d.innerHTML = siteHtml(this.s);
      d.onclick = e => { e.stopPropagation(); info.setContent(popupHtml(this.s)); info.setPosition(this.p); info.setOptions({pixelOffset: new g.Size(0, -14)}); info.open({map}); select(this.s.rank); };
      this.div = d; this.getPanes().overlayMouseTarget.appendChild(d); }
    draw() { const q = this.getProjection().fromLatLngToDivPixel(this.p); this.div.style.left = q.x + "px"; this.div.style.top = q.y + "px"; }
    onRemove() { this.div.remove(); }
  }
  const lay = {open: [], pipe: [], ring: [], sites: []};
  T.forEach(([la, ln, p, n]) => lay[p ? "pipe" : "open"].push(new g.Marker({position: {lat: la, lng: ln}, map: null, optimized: true,
    title: `特斯拉${p ? "在建/规划" : "已开通"}${n ? ` · ${n} 桩` : ""}`,
    icon: {path: g.SymbolPath.CIRCLE, scale: 2.4, fillColor: p ? css("--pipe") : css("--open"), fillOpacity: .75, strokeWeight: 0}})));
  const sites = {}, b = new g.LatLngBounds();
  S.forEach(s => { const o = new Site(s); o.setMap(map); sites[s.rank] = o; lay.sites.push(o); b.extend(o.p);
    lay.ring.push(new g.Circle({center: o.p, radius: 6000, map: null, strokeColor: col(s), strokeWeight: 1, fillColor: col(s), fillOpacity: .08})); });
  map.fitBounds(b, narrow() ? {top: 130, left: 24, right: 24, bottom: 70} : {top: 150, left: 200, right: 200, bottom: 90});
  map.addListener("zoom_changed", () => zoomClass(map.getZoom())); zoomClass(4);
  return {
    name: "底图：Google 地图",
    toggle(k, on) { lay[k].forEach(o => o.setMap(on ? map : null)); },
    focus(s) { map.panTo({lat: s.lat, lng: s.lng}); map.setZoom(12); sites[s.rank].div.onclick(new Event("click")); }
  };
}

function wire() {
  gbtn.title = engine.name;
  [["tOpen", "open"], ["tPipe", "pipe"], ["tRing", "ring"]].forEach(([id, k]) => {
    const el = document.getElementById(id); engine.toggle(k, el.checked); el.onchange = () => engine.toggle(k, el.checked);
  });
  document.querySelectorAll(".card").forEach(c => c.onclick = () => {
    const s = S.find(x => x.rank === +c.dataset.r); select(s.rank); engine.focus(s);
    if (window.innerWidth <= 760) tbtn.click();
  });
}

/* ---------- boot ---------- */
const key = new URLSearchParams(location.search).get("gkey") || GOOGLE_MAPS_API_KEY || store.get("gmaps_key");
const gbtn = document.getElementById("gbtn");
gbtn.textContent = key ? "改用 CARTO" : "使用 Google 底图";
gbtn.onclick = () => {
  if (key) { store.set("gmaps_key", ""); location.href = location.pathname; return; }
  const k = prompt("输入 Google Maps JavaScript API key（只保存在本浏览器）");
  if (k) { store.set("gmaps_key", k.trim()); location.reload(); }
};
function bootLeaflet() {
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
  s.onload = () => { engine = leafletEngine(); wire(); };
  document.head.appendChild(s);
}
if (key) {
  window.initGoogle = () => { engine = googleEngine(); wire(); };
  window.gm_authFailure = () => { alert("Google Maps key 无效，改用 CARTO 底图"); store.set("gmaps_key", ""); location.href = location.pathname; };
  const s = document.createElement("script");
  s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&language=zh-CN&region=US&callback=initGoogle&loading=async`;
  s.async = true; s.onerror = bootLeaflet; document.head.appendChild(s);
} else bootLeaflet();
</script>
</body>
</html>
